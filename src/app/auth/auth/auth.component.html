<div class="auth-page">
  <div class="auth-container">
    <h2>Login</h2>

    <p *ngIf="errorMessage" class="auth-message error">{{ errorMessage }}</p>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="idNumber">ID Number</label>
        <input
          type="text"
          id="idNumber"
          placeholder="Enter your ID Number (example: 2203181)"
          [(ngModel)]="idNumber"
          name="idNumber"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>
</div>
