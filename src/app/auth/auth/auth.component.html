<div class="auth-page">
  <div class="auth-container">
    <h2>{{ isRegistering ? 'Register' : 'Login' }}</h2>

    <p *ngIf="errorMessage" class="auth-message error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="auth-message success">{{ successMessage }}</p>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="idNumber">ID Number</label>
        <input
          type="text"
          id="idNumber"
          placeholder="Enter your ID Number (example: 2203181)"
          [(ngModel)]="idNumber"
          name="idNumber"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn-submit">
        {{ isRegistering ? 'Register' : 'Login' }}
      </button>
    </form>

    <p class="toggle-link">
      <a href="#" (click)="$event.preventDefault(); toggleMode()">
        {{ isRegistering ? 'Already have an account? Login' : 'New user? Register' }}
      </a>
    </p>
  </div>
</div>
