<div class="card shadow-sm border-0 rounded-lg overflow-hidden">
  <div class="bg-primary p-3 text-white">
    <h5 class="mb-0"><mat-icon class="align-middle mr-2">location_on</mat-icon> Deployment Address</h5>
  </div>

  <div class="card-body bg-white p-4">
    <div *ngIf="errorMsg" class="alert alert-danger border-0 small shadow-sm">
      <mat-icon class="align-middle mr-1" style="font-size: 18px;">error</mat-icon>
      {{ errorMsg }}
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="small font-weight-bold text-muted">PROVINCE</label>
        <select class="form-control custom-select border-sky-light" 
  
                (change)="onProvinceChange($event.target.value)"
                [disabled]="!isLoading">
          <option value="" disabled>Select Province</option>
          <option *ngFor="let p of provinces" [value]="p.province">{{ p.province }}</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="small font-weight-bold text-muted">TOWN / CITY</label>
        <select class="form-control custom-select border-sky-light" 
                
                [disabled]="!selectedProvince || !isLoading"
                (change)="onTownChange($event.target.value)">
          <option value="" disabled>Select Town</option>
          <option *ngFor="let t of towns" [value]="t.townOrCity">{{ t.townOrCity }}</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="small font-weight-bold text-muted">BARANGAY</label>
        <select class="form-control custom-select border-sky-light" 
                (change)="selectedBarangay($event.target.value)"
                [disabled]="!selectedTown || !isLoading">
          <option value="" disabled>Select Barangay</option>
          <option *ngFor="let b of barangays" [value]="b.barangay">{{ b.barangay }}</option>
        </select>
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-end align-items-center">
      <div *ngIf="isLoading" class="mr-3 d-flex align-items-center text-primary">
        <div class="spinner-border spinner-border-sm mr-2" role="status"></div>
        <small class="font-weight-bold text-uppercase">Processing...</small>
      </div>

      <button mat-raised-button color="primary" 
              [disabled]="!selectedBarangay || !isLoading"
              (click)="saveAddress()"
              class="px-4 shadow-sm">
        <mat-icon class="mr-1" *ngIf="!isLoading">save</mat-icon>
        {{ isLoading ? 'SAVING DATA...' : 'UPDATE DEPLOYMENT LOCATION' }}
      </button>
    </div>
  </div>
</div>
