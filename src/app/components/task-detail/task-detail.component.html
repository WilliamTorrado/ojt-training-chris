<div class="container-fluid fade-in">
  <button mat-button color="primary" (click)="goBack()" class="mb-3">
    <mat-icon>arrow_back</mat-icon> Back to List
  </button>

  <div class="card shadow-sm border-0 p-4 rounded-lg" *ngIf="task; else noTask">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h6 class="text-uppercase text-primary font-weight-bold mb-1">{{ task.category }}</h6>
        <h2 class="text-slate font-weight-bold">{{ task.description }}</h2>
      </div>
      <span class="badge p-2 px-3 border" 
            [ngClass]="{'bg-danger-light text-danger': task.priority === 'high', 
                       'bg-warning-light text-warning': task.priority === 'medium',
                       'bg-info-light text-info': task.priority === 'low'}">
        {{ task.priority | uppercase }} Priority
      </span>
    </div>
    
    <hr class="border-sky-light my-4">

    <div class="row">
      <div class="col-md-8">
        <h5 class="text-slate font-weight-bold">Additional Details</h5>
        <p class="text-secondary leading-relaxed">{{ task.longDescription }}</p>
      </div>
      <div class="col-md-4 border-left">
        <div class="mb-3">
          <small class="text-muted d-block text-uppercase">Target Deadline</small>
          <span class="font-weight-bold">{{ task.deadline | date: 'MMMM d, y' }}</span>
        </div>
        <div>
          <small class="text-muted d-block text-uppercase">Task ID</small>
          <span class="text-slate">#{{ task.id }}</span>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noTask>
    <div class="alert alert-warning border-0 shadow-sm">
      Task with ID #{{ taskId }} could not be found.
    </div>
  </ng-template>
</div>
