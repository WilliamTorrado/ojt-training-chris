<div class="card shadow-sm border-0 p-4 rounded-lg bg-white">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-slate font-weight-bold text-uppercase mb-0">My Training Tasks</h2>
    <span class="badge badge-primary px-3 py-2">{{ filteredTasks.length }} Tasks</span>
  </div>
  <hr class="border-sky-light">

  <div class="input-group mb-4 shadow-sm">
    <input type="text" class="form-control border-sky-light" #taskInput 
           placeholder="What needs to be done, Jerald?">
    <div class="input-group-append">
      <button class="btn btn-sky-success px-4 text-white" (click)="addTask(taskInput)">
         Add Task
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="bg-sky-light text-slate">
        <tr>
          <th>No.</th>
          <th>Description</th>
          <th>Priority</th>
          <th>Deadline</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of filteredTasks; let i = index">
          <td class="font-weight-bold text-muted">{{ i + 1 }}</td>
          <td [style.text-decoration]="task.isDone ? 'line-through' : 'none'" class="text-slate">
            {{ task.description }}
          </td>
          <td>
            <span class="badge border" 
                  [ngClass]="{'bg-danger-light text-danger': task.priority === 'high', 
                             'bg-warning-light text-warning': task.priority === 'medium',
                             'bg-info-light text-info': task.priority === 'low'}">
              {{ task.priority | uppercase }}
            </span>
          </td>
          <td class="small text-muted">{{ task.deadline | date: 'MMM d, y' }}</td>
          <td>
            <div class="btn-group">
              <button class="btn btn-sm shadow-sm px-3" 
                      [class.btn-sky]="!task.isDone" 
                      [class.btn-light]="task.isDone"
                      (click)="toggleComplete(task)">
                {{ task.isDone ? 'Undo' : 'Done' }}
              </button>
              <button class="btn btn-sm btn-outline-danger ml-2" (click)="deleteTask(task.id)">
                <mat-icon style="font-size: 18px; height: 18px; width: 18px;">delete</mat-icon>
              </button>
            </div>
          </td>
          <td class="text-slate">
             <a [routerLink]="['/tasks', task.id]" class="task-link">
             {{ task.description }}
             </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="filteredTasks.length === 0" class="text-center py-5">
    <mat-icon class="text-muted" style="font-size: 48px; height: 48px; width: 48px;">inventory_2</mat-icon>
    <p class="text-muted mt-2">No tasks found. Time to add some goals!</p>
  </div>
</div>
