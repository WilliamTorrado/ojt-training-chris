<div class="card shadow-sm border-0">
  <div class="bg-primary p-4 text-white d-flex justify-content-between align-items-center">
    <div>
      <h4 class="mb-0 font-weight-bold">Skills Management</h4>
      <small class="opacity-75">Enter your IT Skills</small>
    </div>
    <button type="button" 
            class="btn btn-sm btn-light font-weight-bold" 
            (click)="addSkill()"
            [disabled]="isLastSkillInvalid">
      <mat-icon class="align-middle mr-1">add_circle</mat-icon> Add Skill
    </button>
  </div>

  <div class="card-body p-4">
    <form [formGroup]="skillsForm" (ngSubmit)="submitSkills()">
      
      <div formArrayName="skills">
        <div *ngFor="let skill of skills.controls; let i = index" class="mb-3 fade-in">
          <label class="small font-weight-bold text-muted text-uppercase">Skill #{{ i + 1 }}</label>
          
          <div class="input-group shadow-sm border-rounded-lg">
            <div class="input-group-prepend">
              <span class="input-group-text bg-white border-right-0">
                <mat-icon class="text-sky" style="font-size: 20px;">terminal</mat-icon>
              </span>
            </div>
            
            <input [formControlName]="i" 
                   class="form-control border-left-0" 
                   placeholder="Leadership">

            <div class="input-group-append">
              <button type="button" 
                      class="btn btn-outline-danger" 
                      (click)="removeSkill(i)"
                      [disabled]="skills.length === 1">
                <mat-icon class="align-middle">delete_sweep</mat-icon>
              </button>
            </div>
          </div>

          <div *ngIf="skill.invalid && skill.touched" class="text-danger small mt-1 ml-2">
            Please enter your skill first.
          </div>
        </div>
      </div>

      <div class="mt-5 pt-3 border-top d-flex justify-content-between align-items-center">
        <div class="text-muted small">
          <strong>Total Skills:</strong> {{ skills.length }}
        </div>
        <button type="submit" 
                class="btn btn-success px-5 py-2" 
                [disabled]="skillsForm.invalid">
          Save Skills
        </button>
      </div>
    </form>
  </div>
</div>
