<div class="login-wrapper d-flex align-items-center justify-content-center bg-slate-light">
  <div class="card login-card shadow-lg border-0">
    <div class="card-body p-5 text-center">
      
      <div class="icon-circle bg-sky-light text-primary mb-4 mx-auto">
        <mat-icon style="font-size: 40px; height: 40px; width: 40px;">lock</mat-icon>
      </div>

      <h2 class="font-weight-bold text-slate mb-2">Pathfinder</h2>
      <p class="text-muted mb-4">Please log in to manage your tasks.</p>

      <button mat-raised-button 
              color="primary" 
              class="w-100 py-2 btn-login" 
              (click)='onLogin()'>
        LOGIN AS INTERN
      </button>

      <p class="mt-4 small text-secondary">
        &copy; 2026 BSIT Internship Program
      </p>
    </div>
  </div>
</div>
