<div class="task-form-content">
  <h1>Add Task</h1>

  <form #taskForm="ngForm" (ngSubmit)="onSubmit(taskForm)" class="task-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Task Name</mat-label>
      <input matInput name="name" [(ngModel)]="model.name" required minlength="2" #name="ngModel">
      <mat-error *ngIf="name.invalid && name.touched">
        <span *ngIf="name.errors?.required">Task name is required.</span>
        <span *ngIf="name.errors?.minlength">Task name must be at least 2 characters.</span>
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Details</mat-label>
      <textarea matInput name="details" [(ngModel)]="model.details" rows="4"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Deadline</mat-label>
      <input matInput type="date" name="deadline" [(ngModel)]="model.deadline" #deadline="ngModel">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Priority</mat-label>
      <mat-select name="priority" [(ngModel)]="model.priority" required #priority="ngModel">
        <mat-option *ngFor="let p of priorities" [value]="p.value">{{ p.label }}</mat-option>
      </mat-select>
      <mat-error *ngIf="priority.invalid && priority.touched">Priority is required.</mat-error>
    </mat-form-field>

    <div class="form-actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid">Add Task</button>
    </div>
  </form>
</div>
