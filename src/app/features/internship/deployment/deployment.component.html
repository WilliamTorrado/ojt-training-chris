<div class="deployment-content">
  <h1>Deployment Location</h1>
  <p class="subtitle">Please enter your deployment location.</p>

  <div *ngIf="errorMessage" class="error-message">
    <mat-icon>error</mat-icon>
    <span>{{ errorMessage }}</span>
    <button mat-button (click)="loadProvinces()">Retry</button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading && provinces.length > 0" class="loading-overlay">
         <mat-spinner diameter="30"></mat-spinner>
      </div>

      <form class="deployment-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Province</mat-label>
          <mat-select [formControl]="provinceControl" [disabled]="isLoading">
            <mat-option value="">-- Select Province --</mat-option>
            <mat-option *ngFor="let p of provinces" [value]="p.code || p.province || p">
              {{ p.name || p.province || p }}
            </mat-option>
          </mat-select>
          <mat-spinner *ngIf="isLoading && provinces.length === 0" matSuffix diameter="24"></mat-spinner>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Town/City</mat-label>
          <mat-select [formControl]="townCityControl" [disabled]="!provinceControl.value || isLoading">
            <mat-option value="">-- Select Town/City --</mat-option>
            <mat-option *ngFor="let t of townCities" [value]="t.townOrCity || t">
              {{ t.townOrCity || t }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Barangay</mat-label>
          <mat-select [formControl]="barangayControl" [disabled]="!townCityControl.value || isLoading">
            <mat-option value="">-- Select Barangay --</mat-option>
            <mat-option *ngFor="let b of barangays" [value]="b.barangay || b">
              {{ b.barangay || b }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button 
                  color="primary" 
                  class="save-btn"
                  (click)="onSave()" 
                  [disabled]="isLoading || !barangayControl.value">
            <mat-icon *ngIf="!isLoading">save</mat-icon>
            <span *ngIf="!isLoading">Save Deployment</span>
            <span *ngIf="isLoading">Saving...</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
