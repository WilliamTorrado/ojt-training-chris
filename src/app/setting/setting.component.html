<div class="page-container">
  <h2>Student Profile Settings</h2>
  <p class="hint">Loaded provinces from API: <strong>{{ loadedProvincesCount }}</strong></p>

  <form [formGroup]="profileForm" class="settings-form" (ngSubmit)="saveSettings()">
    <div class="profile-picture">
      <img *ngIf="profilePicturePreview; else defaultAvatar" [src]="profilePicturePreview" alt="Profile Preview" />
      <ng-template #defaultAvatar>
        <div class="avatar-placeholder"></div>
      </ng-template>
      <label for="profile-upload">Upload Profile Picture</label>
      <input id="profile-upload" type="file" accept="image/*" (change)="onProfilePictureSelected($event)" />
    </div>

    <ng-container *ngFor="let field of profileFields">
      <textarea
        *ngIf="field.type === 'textarea'; else textInput"
        [placeholder]="field.placeholder"
        [formControlName]="field.controlName"
      ></textarea>

      <ng-template #textInput>
        <input type="text" [placeholder]="field.placeholder" [formControlName]="field.controlName" />
      </ng-template>

      <small class="error" *ngIf="showError(field.controlName, 'required')">{{ field.requiredMessage }}</small>
      <small class="error" *ngIf="showError(field.controlName, 'whitespace')">{{ field.whitespaceMessage }}</small>
    </ng-container>

    <select formControlName="province">
      <option value="">Select Province</option>
      <option *ngFor="let province of provinces" [value]="province">{{ province }}</option>
    </select>
    <small class="error" *ngIf="showError('province', 'required')">Province is required.</small>

    <select formControlName="townCity">
      <option value="">Select Town/City</option>
      <option *ngFor="let town of townsCities" [value]="town">{{ town }}</option>
    </select>
    <small class="error" *ngIf="showError('townCity', 'required')">Town/City is required.</small>

    <select formControlName="barangay">
      <option value="">Select Barangay</option>
      <option *ngFor="let barangay of barangays" [value]="barangay">{{ barangay }}</option>
    </select>
    <small class="error" *ngIf="showError('barangay', 'required')">Barangay is required.</small>

    <button type="submit" [disabled]="profileForm.invalid">Save Student Profile</button>
  </form>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
</div>
